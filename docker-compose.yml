services:
  postgres:
    image: postgres:17.5-alpine
    container_name: ganttx-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ganttx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: ganttx-storage
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - ganttx_azurite_data:/data
    command: >
      azurite-blob
      --blobHost 0.0.0.0
      --blobPort 10000
      --location /data
      --loose
      --skipApiVersionCheck

volumes:
  ganttx_pgdata:
    driver: local
  ganttx_azurite_data:
    driver: local
