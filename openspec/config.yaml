# SDD OpenSpec Configuration
# Generated by sdd-init — 2026-09-20

context: |
  Ganttx: collaborative real-time project management via Gantt charts
  and calendar views. Next.js 16 App Router, React 19, Prisma 8-rc,
  PostgreSQL 17.5, Tailwind 4, Auth.js (Google OAuth), SSE real-time.
  Screaming Architecture with 5 bounded contexts: auth, projects,
  tasks, calendar, gantt. Bun 1.3.0 package manager.

strict_tdd: false

testing:
  projects:
    - path: "."
      stack: "Next.js 16 / TypeScript 5 / Prisma 8-rc / Tailwind 4"
      test_command: "—"
      test_framework: "—"
      notes: "No test runner installed yet. Add vitest or jest before enabling strict TDD."
  layers:
    - path: "."
      unit: false
      unit_tool: "—"
      integration: false
      integration_tool: "—"
      e2e: false
      e2e_tool: "—"
  coverage:
    - path: "."
      available: false
      command: "—"
  quality:
    - path: "."
      linter: true
      linter_command: "bun run lint"
      type_checker: true
      type_checker_command: "bunx tsc --noEmit"
      formatter: false
      formatter_command: "—"

phases:
  proposal: "Define the change scope and rationale."
  spec: "Write delta specifications for affected domains."
  design: "Produce technical design with file-level plan."
  tasks: "Break design into implementable tasks."
  apply: "Implement tasks following project conventions."
  verify: "Run quality tools and validate acceptance criteria."
  archive: "Close the change with lineage and artifacts."
